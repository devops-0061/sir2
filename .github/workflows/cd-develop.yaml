name: wf-cd-develop
on:
  push:
    branches:
      - develop
jobs:   
  #job to clone repository and build
  upload-artifact-develop: #every job runs on separate runners they might be running in parallel
    runs-on: ubunutu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Build Website With Parcel
        run: npx parcel build "./src/index.html" --dist-dir "./dist" --public-url "./" #store build artifacts in ./dist
      - name: upload Build Artifacts
        uses: actions/upload-pages-artifact@v3
        with: 
          path: "./dist"
          name: "build-artifact-develop"
  #job to deplay build artifacts 
  deploy-artifact-develop:
    needs: "upload-artifact-develop"
    runs-on: ubuntu-latest
    environment: 
      name: "develop-env"
    permissions:
      pages: write #this job should be able to write files on git hub pages
      id-token: write
    steps: 
      - name: Deploy Artifacts on GitHub Pages
        uses: actions/deploy-pages@v4
        with:
          artifact_name: "build-artifact-develop"
          token: "${{github.token}}"

